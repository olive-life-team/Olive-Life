<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채팅 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0a0e27;
    --surface: #151a33;
    --surface2: #1e2542;
    --border: #2a3150;
    --text: #e8eaed;
    --text-muted: #8b92b0;
    --blue: #4c9aff;
    --green: #36b37e;
    --red: #ff5630;
    --yellow: #ffab00;
    --purple: #6554c0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'IBM Plex Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── LAYOUT ─── */
  .container {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
    max-height: 100vh; /* 화면 높이 고정 */
    overflow: hidden;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 24px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 12px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 2s infinite;
  }
  .status-dot.connected {
    background: var(--green);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .user-select {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .user-select label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .user-select select {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: 'IBM Plex Sans KR', sans-serif;
  }
  .user-select select:focus {
    outline: none;
    border-color: var(--blue);
  }

  .room-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .room-list h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 12px;
    font-weight: 600;
  }
  .room-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .room-item:hover {
    border-color: var(--blue);
    background: rgba(76, 154, 255, 0.05);
  }
  .room-item.active {
    border-color: var(--blue);
    background: rgba(76, 154, 255, 0.1);
  }
  .room-item h4 {
    font-size: 15px;
    font-weight: 600;
  }
  .room-item .room-id {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .create-room {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .create-room input {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 8px;
  }
  .create-room input:focus {
    outline: none;
    border-color: var(--blue);
  }
  .create-room button {
    width: 100%;
    padding: 10px;
    background: var(--blue);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .create-room button:hover {
    background: #3d8ee6;
  }

  /* ─── CHAT AREA ─── */
  .chat-area {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    height: 100vh; /* 전체 높이 사용 */
    overflow: hidden;
  }
  .chat-header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .chat-header h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .chat-header p {
    font-size: 13px;
    color: var(--text-muted);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    height: 0;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 70%;
  }
  .message.me {
    align-self: flex-end;
    align-items: flex-end;
  }
  .message-sender {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .message-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.5;
  }
  .message.me .message-bubble {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .message-time {
    font-size: 11px;
    color: var(--text-muted);
  }

  .chat-input-wrapper {
    padding: 20px 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .typing-indicator {
    font-size: 13px;
    color: var(--green);
    padding: 0 0 8px 4px;
    min-height: 24px;
    font-style: italic;
  }
  .typing-indicator .dots {
    display: inline-block;
  }
  .typing-indicator .dots::after {
    content: '...';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }
  .chat-input-form {
    display: flex;
    gap: 12px;
  }
  .chat-input-form input {
    flex: 1;
    padding: 14px 18px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
  }
  .chat-input-form input:focus {
    outline: none;
    border-color: var(--blue);
  }
  .chat-input-form button {
    padding: 14px 24px;
    background: var(--blue);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .chat-input-form button:hover {
    background: #3d8ee6;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 12px;
  }
  .empty-state h3 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }

  .message.system {
    align-self: center;
    max-width: 100%;
    padding: 10px 0;
  }
  .message.system .message-bubble {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    text-align: center;
  }
  /* 시스템 메시지에는 발신자나 시간을 숨김 */
  .message.system .message-sender,
  .message.system .message-time {
    display: none;
  }
  #leaveBtn:hover {
    filter: brightness(0.9);
  }
  #leaveBtn:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>

<div class="container">
  <!-- ════════ SIDEBAR ════════ -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>채팅 테스트</h1>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">연결 대기중...</span>
      </div>
    </div>

    <div class="user-select">
      <label>사용자 선택</label>
      <select id="userSelect">
        <option value="test3@test.com">user1</option>
        <option value="test2@test.com">admin1</option>
      </select>
    </div>

    <div class="room-list">
      <div style="display: flex; justify-content: space-between; align-items: center; padding-right: 12px;">
        <h3>채팅방</h3>
        <div id="adminFilter" style="display: none; gap: 4px;">
          <select id="statusFilter" onchange="handleStatusChange()" style="padding: 4px 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 11px;">
            <option value="WAITING">대기중</option>
            <option value="IN_PROGRESS">처리중</option>
            <option value="COMPLETED">완료</option>
          </select>
        </div>
      </div>
      <div id="roomList"></div>
    </div>

    <div class="create-room" id="create-room">
      <input type="text" id="roomNameInput" placeholder="새 채팅방 이름..."/>
      <button onclick="createRoom()">채팅방 생성</button>
    </div>
  </div>

  <!-- ════════ CHAT AREA ════════ -->
  <div class="chat-area">
    <div class="chat-header" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 id="chatTitle">채팅방을 선택해주세요</h2>
        <p id="chatSubtitle">왼쪽에서 채팅방을 선택하거나 새로 만들어보세요</p>
      </div>
      <button id="leaveBtn" onclick="leaveRoom()" style="display: none; padding: 8px 16px; background: var(--red); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;">
        퇴실하기
      </button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <h3>📭 메시지가 없습니다</h3>
        <p>채팅방을 선택하고 메시지를 보내보세요!</p>
      </div>
    </div>

    <div class="chat-input-wrapper">
      <div class="typing-indicator" id="typingIndicator"></div>
      <form class="chat-input-form" id="chatForm" onsubmit="sendMessage(event)">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." disabled oninput="handleTyping()"/>
        <button type="submit" disabled>전송</button>
      </form>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:8080';
const WS_URL = 'http://localhost:8080/ws';

let stompClient = null;
let currentUserId = null;
let currentUserName = null;
let currentUserRole = null;
let currentRoomId = null;
let jwtToken = null;
let rooms = [];
let currentSubscription = null; // ← 구독 ID 저장용 추가
let typingSubscription = null; // ← 타이핑 구독 ID
let typingTimeout = null; // ← 타이핑 타이머
let typingUsers = new Set(); // ← 현재 입력 중인 사용자들

// ─────────────────────────────────────────────────────────
// 초기화
// ─────────────────────────────────────────────────────────
async function init() {
  // 기본 User 1로 연결
  await initChatTest('test3@test.com', 'Test1234!');
}

async function initChatTest(email, password) {
  // 1. 서버의 실제 로그인 엔드포인트 호출 (프런트가 없으니 여기서 강제 로그인)
  const url = `${API_BASE}/api/auth/login`;
  const loginResponse = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: email,
      password: password
    })
  });

  if (loginResponse.ok) {
    const data = await loginResponse.json();
    // 2. 서버가 주는 실제 JWT 토큰 저장
    jwtToken = data.data.accessToken;
    currentUserId = data.data.member.id;
    currentUserName = data.data.member.name;
    currentUserRole = data.data.member.role;
    console.log("✅ 임시 로그인 성공! 토큰 확보.");

    // --- 관리자 UI 제어 추가 ---
    const adminFilter = document.getElementById('adminFilter');
    if (currentUserRole === 'SUPER_ADMIN' || currentUserRole === 'CS_ADMIN') {
      adminFilter.style.display = 'flex'; // 관리자 필터 노출
      await loadAdminRooms('WAITING');  // 관리자는 대기중 목록 우선 로드
      document.getElementById('create-room').style.display = 'none';
    } else {
      adminFilter.style.display = 'none';  // 고객은 필터 숨김
      await loadRooms();                // 고객은 본인 목록 로드
      document.getElementById('create-room').style.display = 'block';
    }

    // 3. 웹소켓 연결 함수 실행
    connectWebSocket();
  } else {
    console.error("❌ 로그인 실패: 서버의 로그인 로직을 확인하세요.");
  }
}

async function handleStatusChange() {
  const status = document.getElementById('statusFilter').value;
  await loadAdminRooms(status);
}

async function selectUser(userId) {
  try {
    console.log('👤 사용자 선택:', userId);
    
    // JWT 발급
    const url = `${API_BASE}/api/jwt/${userId}`;
    console.log('🔑 JWT 요청:', url);
    
    const response = await fetch(url);
    console.log('🔑 JWT 응답 상태:', response.status);
    
    if (!response.ok) {
      throw new Error(`JWT 발급 실패: ${response.status}`);
    }
    
    jwtToken = await response.text();
    currentUserId = userId;
    currentUserName = userId === 1 ? 'Alice' : 'Bob'; // ← 실제 이름으로 변경
    
    console.log('✅ JWT 발급 완료:', jwtToken.substring(0, 20) + '...');
    
    // WebSocket 연결
    connectWebSocket();
  } catch (error) {
    console.error('❌ JWT 발급 실패:', error);
    alert('사용자 인증에 실패했습니다: ' + error.message);
  }
}

// ─────────────────────────────────────────────────────────
// WebSocket 연결
// ─────────────────────────────────────────────────────────
function connectWebSocket() {
  console.log('🔌 WebSocket 연결 시도:', WS_URL);
  console.log('🔑 JWT 토큰:', jwtToken ? jwtToken.substring(0, 30) + '...' : 'null');
  
  const socket = new SockJS(WS_URL);
  stompClient = Stomp.over(socket);
  
  // 디버그 모드 활성화
  stompClient.debug = function(str) {
    console.log('🔍 STOMP:', str);
  };
  
  stompClient.connect(
    { Authorization: `Bearer ${jwtToken}` },
    function(frame) {
      console.log('✅ WebSocket 연결 완료:', frame);
      updateStatus(true);
    },
    function(error) {
      console.error('❌ WebSocket 연결 실패:', error);
      updateStatus(false);
      
      // 재연결 시도
      setTimeout(() => {
        console.log('🔄 5초 후 재연결 시도...');
        connectWebSocket();
      }, 5000);
    }
  );
}

function updateStatus(connected) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  
  if (connected) {
    dot.classList.add('connected');
    text.textContent = `${currentUserName} 연결됨`;
  } else {
    dot.classList.remove('connected');
    text.textContent = '연결 끊김';
  }
}

// ─────────────────────────────────────────────────────────
// 채팅방 관리
// ─────────────────────────────────────────────────────────
async function loadRooms() {
  try {
    console.log('📋 채팅방 목록 요청 중...');

    const token = jwtToken;

    if (!token) {
      console.error('❌ 인증 토큰이 없습니다. 로그인이 필요합니다.');
      alert('로그인 세션이 만료되었습니다. 다시 로그인해주세요.');
      return;
    }

    const response = await fetch(`${API_BASE}/api/chat/rooms`, {
      method: 'GET',
      headers: {
        // 2. [핵심] Authorization 헤더에 Bearer 토큰 주입
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      }
    });

    console.log('📋 응답 상태:', response.status);
    
    if (!response.ok) {
      console.error('❌ 응답 실패:', response.status, response.statusText);
      return;
    }

    const result = await response.json(); // result는 ApiResponse 객체

    if (result.success) {
      rooms = result.data;
      console.log('✅ 채팅방 목록 로드 완료:', rooms);
      renderRooms();
    }
  } catch (error) {
    console.error('❌ 채팅방 목록 로드 실패:', error);
  }
}

async function loadAdminRooms(status) {
  try {
    console.log('📋 채팅방 목록 요청 중...');

    const token = jwtToken;

    if (!token) {
      console.error('❌ 인증 토큰이 없습니다. 로그인이 필요합니다.');
      alert('로그인 세션이 만료되었습니다. 다시 로그인해주세요.');
      return;
    }

    const response = await fetch(`${API_BASE}/api/admin/chat/rooms?status=${encodeURIComponent(status)}`, {
      method: 'GET',
      headers: {
        // 2. [핵심] Authorization 헤더에 Bearer 토큰 주입
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      }
    });

    console.log('📋 응답 상태:', response.status);

    if (!response.ok) {
      console.error('❌ 응답 실패:', response.status, response.statusText);
      return;
    }

    const result = await response.json(); // result는 ApiResponse 객체

    if (result.success) {
      rooms = result.data;
      console.log('✅ 채팅방 목록 로드 완료:', rooms);
      renderRooms();
    }

  } catch (error) {
    console.error('❌ 채팅방 목록 로드 실패:', error);
  }
}

async function createRoom() {
  const input = document.getElementById('roomNameInput');
  const name = input.value.trim();
  const token = jwtToken;

  // 1. @NotBlank 대응: 필수 입력 및 공백만 입력 체크
  if (!name) {
    alert('채팅방 이름을 입력해주세요. (공백만 입력할 수 없습니다)');
    input.focus();
    return;
  }

  // 2. @Size(min = 2, max = 20) 대응: 글자 수 체크
  if (name.length < 2 || name.length > 20) {
    alert('채팅방 이름은 2자 이상 20자 이하로 입력해주세요.');
    input.focus();
    return;
  }

  // 3. @Pattern 대응: 허용되지 않는 문자(특수문자 등) 체크
  // 정규표현식: 한글, 영문, 숫자, 공백만 허용
  const titleRegex = /^[a-zA-Z0-9가-힣\s]*$/;
  if (!titleRegex.test(name)) {
    alert('채팅방 이름에 특수문자를 사용할 수 없습니다. (한글, 영문, 숫자만 가능)');
    input.focus();
    return;
  }
  
  try {
    console.log('🏗️ 채팅방 생성 요청:', name);
    const url = `${API_BASE}/api/chat/rooms?title=${encodeURIComponent(name)}`;

    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });

    console.log('🏗️ 응답 상태:', response.status);
    
    if (!response.ok) {
      console.error('❌ 생성 실패:', response.status, response.statusText);
      alert('채팅방 생성에 실패했습니다.');
      return;
    }
    
    const room = await response.json();
    console.log('✅ 채팅방 생성 완료:', room);
    
    // 목록 새로고침
    // --- 관리자 UI 제어 추가 ---
    const adminFilter = document.getElementById('adminFilter');
    if (currentUserRole === 'SUPER_ADMIN' || currentUserRole === 'CS_ADMIN') {
      adminFilter.style.display = 'flex'; // 관리자 필터 노출
      await loadAdminRooms('WAITING');  // 관리자는 대기중 목록 우선 로드
      document.getElementById('create-room').style.display = 'none';
    } else {
      adminFilter.style.display = 'none';  // 고객은 필터 숨김
      await loadRooms();                // 고객은 본인 목록 로드
      document.getElementById('create-room').style.display = 'block';
    }

    input.value = '';
  } catch (error) {
    console.error('❌ 채팅방 생성 실패:', error);
    alert('채팅방 생성 중 오류가 발생했습니다: ' + error.message);
  }
}

function renderRooms() {
  const container = document.getElementById('roomList');

  // rooms가 만약 Page/Slice 객체라면 그 안의 content를 사용, 아니면 그대로 사용
  const roomList = Array.isArray(rooms) ? rooms : (rooms.content || []);

  if (roomList.length === 0) {
    container.innerHTML = '<p style="padding:12px; color:var(--text-muted); font-size:13px;">채팅방이 없습니다.</p>';
    return;
  }

  container.innerHTML = rooms.map(room => `
    <div class="room-item ${currentRoomId === room.id ? 'active' : ''}" onclick="selectRoom(${room.id}, '${room.title}', '${room.status}')">
      <div>
        <h4>${room.title}</h4>
        <div class="room-id">ID: ${room.id}</div>
      </div>
    </div>
  `).join('');
}

async function selectRoom(roomId, roomName, status) {
  // 기존 구독 해제
  if (currentSubscription) {
    console.log('🔴 기존 구독 해제:', currentRoomId);
    currentSubscription.unsubscribe();
    currentSubscription = null;
  }
  if (typingSubscription) {
    typingSubscription.unsubscribe();
    typingSubscription = null;
  }
  
  currentRoomId = roomId;
  lastMessageId = null;
  hasNextMessages = true;
  typingUsers.clear();
  updateTypingIndicator();
  
  // UI 업데이트
  document.getElementById('chatTitle').textContent = roomName;
  document.getElementById('chatSubtitle').textContent = `Room ID: ${roomId}`;
  if (status !== 'COMPLETED') {
    document.getElementById('messageInput').disabled = false;
    document.querySelector('.chat-input-form button').disabled = false;
    document.getElementById('leaveBtn').style.display = 'block';
  } else {
    document.getElementById('messageInput').disabled = true;
    document.querySelector('.chat-input-form button').disabled = true;
    document.getElementById('leaveBtn').style.display = 'none';
  }

  renderRooms();
  clearMessages();
  
  // 과거 메시지 로드
  await loadPastMessages(roomId, true);
  
  // 새 채팅방 구독
  if (stompClient && stompClient.connected) {
    // 메시지 구독
    currentSubscription = stompClient.subscribe(`/sub/chat/${roomId}`, function(message) {
      console.log('📨 메시지 수신:', message.body);
      const data = JSON.parse(message.body);
      displayMessage(data);
    });
    
    // 타이핑 인디케이터 구독
    typingSubscription = stompClient.subscribe(`/sub/chat/${roomId}/typing`, function(message) {
      const data = JSON.parse(message.body);
      handleTypingIndicator(data);
    });

    const enterMessage = {
      roomId: roomId,
      type: "ENTER"
    };

    stompClient.send('/pub/chat.send', {}, JSON.stringify(enterMessage));
    
    console.log('✅ 채팅방', roomId, '구독 시작');
  }
}

// 채팅방 퇴실 함수
async function leaveRoom() {
  if (!currentRoomId) return;

  if (!confirm('정말 이 채팅방에서 퇴실하시겠습니까?')) return;

  try {
    const response = await fetch(`${API_BASE}/api/chat/rooms/${currentRoomId}/leave`, {
      method: 'PATCH',
      headers: {
        'Authorization': `Bearer ${jwtToken}`,
        'Content-Type': 'application/json'
      }
    });

    if (response.ok) {
      alert('퇴실 처리가 완료되었습니다.');

      // 1. 상태 초기화
      currentRoomId = null;

      // 2. UI 초기화
      document.getElementById('chatTitle').textContent = '채팅방을 선택해주세요';
      document.getElementById('chatSubtitle').textContent = '왼쪽에서 채팅방을 선택하거나 새로 만들어보세요';
      document.getElementById('leaveBtn').style.display = 'none';
      document.getElementById('messageInput').disabled = true;
      document.querySelector('.chat-input-form button').disabled = true;
      clearMessages();

      // 3. 목록 새로고침
      const result = await response.json();
      const status = result.data.status;
      await loadAdminRooms(status);
      await loadRooms();

    } else {
      const result = await response.json();
      alert(result.message || '퇴실 처리에 실패했습니다.');
    }
  } catch (error) {
    console.error('❌ 퇴실 요청 에러:', error);
    alert('오류가 발생했습니다.');
  }
}

// ─────────────────────────────────────────────────────────
// 타이핑 인디케이터
// ─────────────────────────────────────────────────────────
function handleTyping() {
  if (!currentRoomId || !stompClient || !stompClient.connected) return;
  
  // 타이핑 중 신호 전송
  sendTypingStatus(true);
  
  // 기존 타이머 취소
  if (typingTimeout) {
    clearTimeout(typingTimeout);
  }
  
  // 2초 후 타이핑 중지 신호 전송
  typingTimeout = setTimeout(() => {
    sendTypingStatus(false);
  }, 2000);
}

function sendTypingStatus(isTyping) {
  if (!stompClient || !stompClient.connected || !currentRoomId) return;
  
  const typingData = {
    roomId: currentRoomId,
    typing: isTyping
  };
  
  stompClient.send('/pub/chat.typing', {}, JSON.stringify(typingData));
}

function handleTypingIndicator(data) {
  // 내가 보낸 타이핑 신호는 무시
  if (data.userId === currentUserId) return;
  
  if (data.typing) {
    typingUsers.add(data.userName);
  } else {
    typingUsers.delete(data.userName);
  }
  
  updateTypingIndicator();
}

function updateTypingIndicator() {
  const indicator = document.getElementById('typingIndicator');
  
  if (typingUsers.size === 0) {
    indicator.innerHTML = '';
  } else if (typingUsers.size === 1) {
    const userName = Array.from(typingUsers)[0];
    indicator.innerHTML = `${userName}이 입력 중<span class="dots"></span>`;
  } else {
    indicator.innerHTML = `${typingUsers.size}명이 입력 중<span class="dots"></span>`;
  }
}

// ─────────────────────────────────────────────────────────
// 메시지 전송/수신
// ─────────────────────────────────────────────────────────
// 페이징 상태 관리를 위한 변수 (선택된 방이 바뀔 때마다 초기화 필요)
let lastMessageId = null;
let hasNextMessages = true;
let isLoadingMessages = false;

async function loadPastMessages(roomId, isInitial = true) {
  if (isLoadingMessages || (!isInitial && !hasNextMessages)) return;

  const container = document.getElementById('chatMessages');
  const previousScrollHeight = container.scrollHeight;

  try {
    isLoadingMessages = true;

    // 1. URL 구성: 커서가 존재하면 쿼리 파라미터 추가
    let url = `${API_BASE}/api/chat/rooms/${roomId}/messages?size=20`;
    if (!isInitial && lastMessageId) {
      url += `&cursor=${lastMessageId}`;
    }

    const response = await fetch(url, {
      headers: { 'Authorization': `Bearer ${jwtToken}` }
    });

    if (!response.ok) throw new Error('메시지 로드 실패');

    const result = await response.json();
    const data = result.data;
    const messages = data.content;

    if (messages && messages.length > 0) {
      lastMessageId = messages[messages.length - 1].messageId;
      hasNextMessages = !data.last;

      // 화면 표시를 위해 시간순 정렬
      const sortedMessages = [...messages].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

      if (isInitial) {
        clearMessages();
        sortedMessages.forEach(msg => {
          container.appendChild(createMessageElement(msg));
        });
        container.scrollTop = container.scrollHeight;
      } else {
        const existingIds = Array.from(container.querySelectorAll('.message-id-tag')).map(el => el.value);

        [...sortedMessages].reverse().forEach(msg => {
          container.insertBefore(createMessageElement(msg), container.firstChild);
        });

        container.scrollTop = container.scrollHeight - previousScrollHeight;
      }
    }
  } catch (error) {
    console.error('❌ 메시지 로드 실패:', error);
  } finally {
    isLoadingMessages = false;
  }
}

function createMessageElement(data) {
  const isMe = data.senderId === currentUserId;
  const isSystem = data.content &&
          (data.content.includes("입장했습니다") ||
                  data.content.includes("퇴장했습니다") ||
                  data.content.includes("끊겼습니다"));
  const time = data.createdAt ? new Date(data.createdAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '오후 00:00';

  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${isMe ? 'me' : ''} ${isSystem ? 'system' : ''}`;
  messageDiv.innerHTML = `
    <div class="message-sender">${data.senderName}</div>
    <div class="message-bubble">${escapeHtml(data.content)}</div>
    <div class="message-time">${time}</div>
  `;
  return messageDiv;
}

document.getElementById('chatMessages').addEventListener('scroll', function(e) {
  // scrollTop이 0(맨 위)에 도달했을 때 추가 로드
  if (e.target.scrollTop <= 5 && hasNextMessages && !isLoadingMessages) {
    console.log('🔄 이전 메시지 더 불러오기...');
    loadPastMessages(currentRoomId, false);
  }
});

function sendMessage(event) {
  event.preventDefault();
  
  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  
  if (!content || !currentRoomId) return;
  
  const message = {
    roomId: currentRoomId,
    content: content
  };
  
  stompClient.send('/pub/chat.send', {}, JSON.stringify(message));
  input.value = '';
  
  // 타이핑 중지 신호 전송
  sendTypingStatus(false);
  if (typingTimeout) {
    clearTimeout(typingTimeout);
    typingTimeout = null;
  }
  
  console.log('메시지 전송:', message);
}

function displayMessage(data) {
  const container = document.getElementById('chatMessages');
  
  // empty state 제거
  const emptyState = container.querySelector('.empty-state');
  if (emptyState) {
    emptyState.remove();
  }
  
  const isMe = data.senderId === currentUserId;
  const isSystem = data.content &&
          (data.content.includes("입장했습니다") ||
                  data.content.includes("퇴장했습니다") ||
                  data.content.includes("끊겼습니다"));
  const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  
  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${isMe ? 'me' : ''} ${isSystem ? 'system' : ''}`;
  messageDiv.innerHTML = `
    <div class="message-sender">${data.senderName}</div>
    <div class="message-bubble">${escapeHtml(data.content)}</div>
    <div class="message-time">${time}</div>
  `;
  
  container.appendChild(messageDiv);
  container.scrollTop = container.scrollHeight;
}

function displayPastMessage(data) {
  const container = document.getElementById('chatMessages');
  
  // empty state 제거
  const emptyState = container.querySelector('.empty-state');
  if (emptyState) {
    emptyState.remove();
  }
  
  const isMe = data.senderId === currentUserId;
  
  // createdAt 필드를 사용하여 시간 표시
  let time = '오후 00:00';
  if (data.createdAt) {
    const date = new Date(data.createdAt);
    time = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }
  
  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${isMe ? 'me' : ''}`;
  messageDiv.innerHTML = `
    <div class="message-sender">${data.senderName}</div>
    <div class="message-bubble">${escapeHtml(data.content)}</div>
    <div class="message-time">${time}</div>
  `;
  
  container.appendChild(messageDiv);
}

function clearMessages() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = `
    <div class="empty-state">
      <h3>📭 메시지가 없습니다</h3>
      <p>채팅방을 선택하고 메시지를 보내보세요!</p>
    </div>
  `;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ─────────────────────────────────────────────────────────
// 사용자 변경
// ─────────────────────────────────────────────────────────
document.getElementById('userSelect').addEventListener('change', async function(e) {
  const email = e.target.value;
  
  // 기존 구독 해제
  if (currentSubscription) {
    currentSubscription.unsubscribe();
    currentSubscription = null;
  }
  if (typingSubscription) {
    typingSubscription.unsubscribe();
    typingSubscription = null;
  }
  
  // 기존 연결 끊기
  if (stompClient) {
    stompClient.disconnect();
  }
  
  // 새 사용자로 재연결
  await initChatTest(email, 'Test1234!');
  currentRoomId = null;
  typingUsers.clear();
  clearMessages();
  
  // 채팅방 목록 새로고침
  // 목록 새로고침
  // --- 관리자 UI 제어 추가 ---
  const adminFilter = document.getElementById('adminFilter');
  if (currentUserRole === 'SUPER_ADMIN' || currentUserRole === 'CS_ADMIN') {
    adminFilter.style.display = 'flex'; // 관리자 필터 노출
    await loadAdminRooms('WAITING');  // 관리자는 대기중 목록 우선 로드
    document.getElementById('create-room').style.display = 'none';
  } else {
    adminFilter.style.display = 'none';  // 고객은 필터 숨김
    await loadRooms();                // 고객은 본인 목록 로드
    document.getElementById('create-room').style.display = 'block';
  }
  
  document.getElementById('messageInput').disabled = true;
  document.querySelector('.chat-input-form button').disabled = true;
});

// ─────────────────────────────────────────────────────────
// 시작
// ─────────────────────────────────────────────────────────
init();
</script>
