events {}

http {
    # 도커 내부 DNS 서버 주소 (보통 127.0.0.11)
        resolver 127.0.0.11 valid=5s;

        upstream coupon_backend {
            # 'max_fails'와 'fail_timeout'을 명시하여 일시적 오류에 유연하게 대처
            server app1:8080 max_fails=3 fail_timeout=10s;
            server app2:8080 max_fails=3 fail_timeout=10s;
        }

    server {
        listen 80;

        location / {
            proxy_pass http://coupon_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
